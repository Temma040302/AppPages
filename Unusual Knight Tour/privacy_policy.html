<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unusual Knight Tour プライバシーポリシー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2430;
      --ink-soft: #3d4a5c;
      --paper: #f3f6f9;
      --sea: #2f6f7e;
      --sea-deep: #1f4f5a;
      --line: rgba(26, 36, 48, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.8;
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(47, 111, 126, 0.14), transparent 55%),
        linear-gradient(165deg, #dfe8ef 0%, var(--paper) 42%, #eef3f6 100%);
      background-attachment: fixed;
    }

    .wrap {
      width: min(720px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 3.5rem 0 4rem;
    }

    .back {
      display: inline-block;
      margin-bottom: 2rem;
      color: var(--sea-deep);
      font-size: 0.9rem;
      text-decoration: none;
      border-bottom: 1px solid rgba(31, 79, 90, 0.28);
    }

    .back:hover { color: var(--sea); border-bottom-color: var(--sea); }

    h1 {
      font-family: "Shippori Mincho", serif;
      font-size: clamp(1.75rem, 5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.3;
      margin-bottom: 1.25rem;
    }

    h2 {
      font-family: "Shippori Mincho", serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 2.25rem 0 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--line);
    }

    p {
      color: var(--ink-soft);
      margin-bottom: 0.85rem;
    }

    ul {
      color: var(--ink-soft);
      margin: 0 0 0.85rem 1.25rem;
      line-height: 2;
    }

    .date {
      margin-bottom: 1.25rem;
      color: var(--ink);
      font-weight: 500;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 3.5rem 0;
    }

    a {
      color: var(--sea-deep);
      text-underline-offset: 0.2em;
    }

    a:hover { color: var(--sea); }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../index.html">← サポートページへ</a>

    <h1>プライバシーポリシー</h1>
    <p class="date"><strong>最終更新日：</strong>2026年2月11日</p>
    <p>本アプリは、ユーザーの個人情報を一切収集、保存、送信いたしません。</p>
    <p>アプリ内で入力されたデータは、すべてユーザーの端末内でのみ処理され、外部サーバー等へ送信されることはありません。</p>
    <p>今後仕様の変更等によりデータの取り扱いに変更が生じた場合は、本ページにてお知らせいたします。</p>
  </main>
</body>
</html>
